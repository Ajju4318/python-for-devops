apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-2gb
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data-2gb

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-4gb
spec:
  capacity:
    storage: 4Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data-4gb
